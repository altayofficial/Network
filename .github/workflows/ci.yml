name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sockets, openssl, gmp, ffi

      # The WebRTC stack dlopens libsrtp2 through FFI while bringing up DTLS. Without it the
      # extension loads but no peer connection can be created, so the integration tests skip
      # themselves and the negotiation path goes uncovered.
      - name: Install libsrtp2
        run: sudo apt-get update && sudo apt-get install -y libsrtp2-dev

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Lint sources
        run: |
          fail=0
          while IFS= read -r file; do
            php -l "$file" > /dev/null || fail=1
          done < <(find src -name "*.php")
          exit $fail

      - name: PHPStan
        run: composer analyse

      - name: PHPUnit
        run: composer test
